name: Feature request
description: Suggest an improvement or new feature.
title: "[Feature]: "
labels:

* enhancement
  body:

* type: markdown
  attributes:
  value: |
  Thanks for the suggestion!

  ```
  Before submitting, please check whether someone has already suggested the same idea.
  ```

* type: textarea
  id: problem
  attributes:
  label: What problem would this solve?
  description: Tell us what you'd like to improve and why.
  placeholder: Describe the problem or limitation.
  validations:
  required: true

* type: textarea
  id: solution
  attributes:
  label: What would you like to see?
  description: Describe your proposed solution.
  placeholder: Describe your idea.
  validations:
  required: true

* type: textarea
  id: alternatives
  attributes:
  label: Alternatives
  description: Are there other solutions you've considered?
  placeholder: Optional.

* type: textarea
  id: additional
  attributes:
  label: Additional information
  placeholder: Anything else you'd like to add?
